CONFIG_POSIX_API=y
CONFIG_EVENTS=y

# GPIO Configuration
CONFIG_GPIO=y

# Wi-Fi Configuration
CONFIG_WIFI=y
CONFIG_REBOOT=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=10240

CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_CANARIES=y
CONFIG_SPIN_VALIDATE=n
# Synchronous getaddrinfo() uses this as its DNS query timeout. The default
# (2000 ms) is too short for a DPM cold-wake + eRPC/SPI + network round-trip
# (~2.4 s), which cancels the in-flight query (DNS_EAI_CANCELED = -101) just
# before the reply arrives. Give it enough budget to cover the cold wake.
CONFIG_NET_SOCKETS_DNS_TIMEOUT=10000
# Retry within that budget instead of a single long attempt.
CONFIG_NET_SOCKETS_DNS_BACKOFF_INTERVAL=5000
 
# Network Configuration
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=n

# Network management
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_CONNECTION_MANAGER=y

CONFIG_MAIN_STACK_SIZE=10240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=10240
CONFIG_WIFI_ERPC_WIFI_WORKQ_STACK_SIZE=8192
CONFIG_WIFI_ERPC_WIFI_SERVER_THREAD_STACK_SIZE=8192
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096

# Network buffers
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8

# L2 drivers
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y

# LOG — immediate mode has no buffer/thread so LOG_BUFFER_SIZE
# and LOG_PROCESS_THREAD_STACK_SIZE do not exist here.
# NET/SOCKET/KERNEL kept at WRN to avoid flooding UART and
# hiding the poll-task printks that appear before the crash.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_NET_LOG=n
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=n
CONFIG_NET_L2_WIFI_MGMT_LOG_LEVEL_DBG=n
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_THREAD_LOCAL_STORAGE=n
# ===========================================================
# MPU / FAULT DEBUG — verified buildable on nRF5340 Zephyr 4.2
# ===========================================================

# Full register + MPU fault reason on crash
CONFIG_FAULT_DUMP=2

# Hardware MPU guard page at stack bottom (catches stack overflow)
# NOTE: STACK_SENTINEL conflicts with MPU_STACK_GUARD — do not add it
CONFIG_MPU_STACK_GUARD=y
CONFIG_HW_STACK_PROTECTION=y

# Thread name + stack bounds printed in the fault dump
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_DEBUG_THREAD_INFO=y

# Catch NULL / bad-state in kernel before it reaches the MPU
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
CONFIG_ASSERT_VERBOSE=y

# Keep debug symbols — required for addr2line to give file+line
# REMOVE this after the bug is fixed (increases binary size)
# CONFIG_DEBUG_OPTIMIZATIONS=y

# Heap stats — reveals if heap returned NULL causing the deref
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# NOTE: EXCEPTION_STACK_TRACE, ARM_UNWIND, COREDUMP are all
# unavailable in Zephyr 4.2.99 for nRF5340. Use addr2line instead
# (see instructions below the conf file).

CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_NET_ZPERF_MAX_PACKET_SIZE=2048
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SHELL=y
CONFIG_ZVFS_POLL_MAX=10
CONFIG_ZVFS_OPEN_MAX=12
 
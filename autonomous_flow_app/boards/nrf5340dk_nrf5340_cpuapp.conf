CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
# Deferred logging: immediate UART logging inside the SPI/eRPC path made
# every eRPC call take 600-900 ms and broke the 500 ms PMGR timeout.
CONFIG_LOG_MODE_DEFERRED=y


CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=65536
CONFIG_LOG_BACKEND_UART=n

CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_NET_SHELL=y
CONFIG_REBOOT=y
CONFIG_SHELL_LOG_BACKEND=y

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AUTO_INIT=y
# Synchronous getaddrinfo() uses this as its DNS query timeout. The default
# (2000 ms) is too short for a DPM cold-wake + eRPC/SPI + network round-trip
# (~2.4 s), which cancels the in-flight query (DNS_EAI_CANCELED = -101) just
# before the reply arrives. Give it enough budget to cover the cold wake.
CONFIG_NET_SOCKETS_DNS_TIMEOUT=10000
# Retry within that budget instead of a single long attempt.
CONFIG_NET_SOCKETS_DNS_BACKOFF_INTERVAL=5000

CONFIG_NETWORKING=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_ZVFS_POLL_MAX=16
CONFIG_HTTP_CLIENT=y

CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=32768
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_SERVER_NAME_INDICATION=y
# Also bounds the TLS handshake; 3 s default is too short over eRPC/SPI offload.
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=30000

CONFIG_NET_IPV6=n
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NET_CONFIG_AUTO_INIT=n

CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_NET_CONFIG_LOG_LEVEL_DBG=y
CONFIG_WORKQUEUE_WORK_TIMEOUT=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ERPC_DATA_PATH=y
CONFIG_ENTROPY_GENERATOR=y
